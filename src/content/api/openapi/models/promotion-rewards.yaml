x-title: Promotion Rewards Model
x-intro: |
  Rewards are expressed as a tree of `and`/`or` groups rather than a flat list, so that rewards can be grouped for conditional logic. Each item in the group's array is either a leaf [Promotion Reward](/api/promotions#promotion-reward-model) or another nested Promotion Rewards group. For `challenge` promotions, every leaf reward in the tree is issued when the Promotion is completed, so only `and` is allowed. For `draw` promotions, `or` is also allowed, to be used once winner selection logic decides which branch of rewards is issued; a group must have exactly one of `and` or `or`.
type: object
properties:
  and:
    type: array
    items:
      type: object
    description: A list of [Promotion Rewards](/api/promotions#promotion-reward-model) and/or nested Promotion Rewards groups, all of which are issued. Mutually exclusive with `or`.
  or:
    type: array
    items:
      type: object
    description: A list of [Promotion Rewards](/api/promotions#promotion-reward-model) and/or nested Promotion Rewards groups, of which one branch is issued. Only supplied if the Promotion's `type` is `draw`. Mutually exclusive with `and`.
