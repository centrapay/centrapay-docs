x-title: Promotion Rewards Model
type: object
properties:
  and:
    type: array
    items:
      type: object
    description: A list of Promotion Rewards and/or nested Promotion Rewards groups, all of which are issued. Mutually exclusive with `or`.
  or:
    type: array
    items:
      type: object
    description: A list of Promotion Rewards and/or nested Promotion Rewards groups, of which one branch is issued. Only supplied if the Promotion's `type` is `draw`. Mutually exclusive with `and`.
