x-title: Merchant Search Result Model
type: object
properties:
  id:
    type: string
    description: Merchant's unique identifier
  name:
    type: string
    description: Merchant's name
  acceptedAssets:
    type: array
    description: List of assets accepted by the merchant.
    items:
      $ref: './accepted-asset.yaml'
  location:
    type: object
    x-type: location
    description: Physical location of the merchant
  accountId:
    type: string
    description: Id of Merchant's owning Centrapay account.
  categoryCode:
    type: string
    description: The category code assigned to the Merchant by Centrapay. Must be 4 digits.
  loyaltyPrograms:
    type: array
    description: Array of [Loyalty Programs](/api/loyalty-programs) that the merchant supports. If auth is provided, we will also compute whether the caller is a member of each loyalty program.
    items:
      type: object
