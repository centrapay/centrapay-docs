x-title: Asset Transaction Activity Model
x-intro: |
  The `destParty` and `srcParty` are optionally provided only on transactions of
  type `transfer`. Values may include a merchant name, user handle, masked user
  email, masked user phone, or bank account.

  The `otherParty` is optionally provided only on transactions of type
  `increment-balance` and `decrement-balance`. Values may include bank account
  number.

  This extends the [asset activity model](#asset-activity-model)
type: object
properties:
  ref:
    type: string
    description: ID of the Centrapay resource that initiated the transaction.
  refType:
    type: string
    description: Name of the Centrapay resource that initiated the transaction.
  type:
    type: string
    enum: [increment-balance, decrement-balance, transfer]
    description: Type of the Asset Transaction.
    x-values:
      entries:
        - name: "increment-balance"
          description: Funds were added from outside Centrapay, eg a bank top up.
        - name: "decrement-balance"
          description: Funds were removed to outside Centrapay, eg a withdrawal to a bank account.
        - name: "transfer"
          description: Value moved between two Centrapay assets, eg a payment or a transfer between users.
  kind:
    type: string
    description: Human readable value indicating the reason for the transaction.
  srcAssetId:
    type: string
    description: ID of the source asset.
  destAssetId:
    type: string
    description: ID of the destination asset.
  srcParty:
    type: string
    description: Display value for party providing funds.
  destParty:
    type: string
    description: Display value for party receiving funds.
  otherParty:
    type: string
    description: Display value for party providing or receiving funds.
  amount:
    type: string
    description: Amount of transaction in cents.
