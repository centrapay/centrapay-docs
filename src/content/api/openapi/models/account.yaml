x-title: Account Model
type: object
properties:
  id:
    type: string
    description: The unique identifier.
  type:
    type: string
    enum: [org, individual]
    description: The Account type.
    x-values:
      entries:
        - name: "org"
          description: A business or organisation account that can have multiple members.
        - name: "individual"
          description: A personal account for a single user. Each user can have only one, and its members can't be changed.
  name:
    type: string
    description: The display name of the Account.
  region:
    type: string
    description: The region that the Account will operate in.
  test:
    type: boolean
    description: A flag which is only present if the Account is for testing.
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Account was created.
  modifiedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Account was updated.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Account.
  modifiedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Account.
  subscriptions:
    type: array
    description: A list of Subscriptions on the Account.
    items:
      $ref: './accounts-subscription.yaml'
  parentAccountId:
    type: string
    description: The unique identifier of the parent account to which the current account is linked. This field establishes a hierarchical relationship between accounts, indicating that the current account was created by the specified parent account.
