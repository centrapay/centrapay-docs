x-title: Quota Model
type: object
properties:
  type:
    type: string
    description: The quota's type.
    x-values:
      title: "Supported Quota Types"
      entries:
        - name: "spend"
          description: "Value of wallet asset-based payments or asset transfers from the account."
          notes:
            - label: "Scoped"
              value: "Yes"
            - label: "Periods"
              value: "`monthly` `yearly`"
        - name: "topup"
          description: "Value of topups from bank accounts linked to the account."
          notes:
            - label: "Scoped"
              value: "Yes"
            - label: "Periods"
              value: "`monthly` `yearly`"
  limit:
    x-type: bignumber
    type: string
    description: The quota's upper usage limit.
  usage:
    x-type: bignumber
    type: string
    description: The quota's current usage.
  assetType:
    type: string
    description: The type of asset the quota is scoped to, eg `centrapay.nzd.main`.
  period:
    type: string
    enum: [monthly, yearly]
    description: The recurring, time-bound quota's duration.
    x-values:
      entries:
        - name: "monthly"
          description: Usage is counted per calendar month and resets on the 1st.
        - name: "yearly"
          description: Usage is counted per calendar year and resets on 1 January.
  interval:
    type: string
    description: 'The specific day, month or year the quota applies to, eg: `2020-01-01`, `2020-01`, `2020`.'
