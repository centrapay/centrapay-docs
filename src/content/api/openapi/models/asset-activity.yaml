x-title: Asset Activity Model
# The activityType-specific models an activity can take. Each is revealed
# inline from the routes that return activities, keeping the anchors the
# page's old per-model sections had.
x-variants:
  - asset-transaction-activity
  - token-refunded-activity
  - token-redeemed-activity
  - asset-created-activity
  - asset-received-activity
  - asset-sent-activity
type: object
properties:
  assetId:
    type: string
    description: ID of the Asset the activity is for
  activityNumber:
    type: string
    description: Unique sequential Asset activity number
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Activity was created.
  createdBy:
    type: string
    description: The service that created the activity
  activityType:
    type: string
    description: The type of Asset Activity.
    x-values:
      title: "Asset Activity Types"
      entries:
        - name: "token"
          description: "Token was refunded."
        - name: "value-in"
          description: "Asset value has been increased."
        - name: "value-out"
          description: "Asset value has been decreased."
        - name: "archive-asset"
          description: "Asset was archived."
        - name: "activate-asset"
          description: "Asset was activated."
        - name: "disable-asset"
          description: "Asset was disabled."
        - name: "token-redeemed"
          description: "Token was redeemed."
        - name: "created"
          description: "Asset was created."
        - name: "received"
          description: "Asset was received."
        - name: "sent"
          description: "Asset was sent."
  accountId:
    type: string
    description: The account that owns the asset
