x-title: Business Model
type: object
required:
  - location
properties:
  id:
    type: string
    description: The unique identifier.
  accountId:
    type: string
    description: The Centrapay accountId for an org account.
  accountName:
    type: string
    description: The Centrapay account name for an org account.
  nzbn:
    type: string
    description: The unique NZBN identifier.
  name:
    type: string
    description: Legal name recorded in the Companies Register.
  tradingName:
    type: string
    description: Trading name recorded in the Companies Register.
  companyNumber:
    type: string
    description: Company number recorded in the Companies Register.
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Business was created.
  updatedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Business was updated.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Business.
  updatedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Business.
  taxNumber:
    type: object
    description: The value-added tax configuration for the Business. See [Tax Number Model](#tax-number-model).
    allOf:
      - $ref: './businesses-tax-number.yaml'
  location:
    type: object
    x-type: location
    description: The physical address of the Business.
  onboardingStatus:
    type: string
    enum: [applied, provisioning, active, on-hold, deactivated, archived]
    description: The onboarding status of the Business. See [Onboarding Statuses](#onboarding-statuses) for possible values.
    x-values:
      title: "Onboarding Statuses"
      entries:
        - name: "applied"
          description: "Identifies businesses that have registered to be activated for the Centrapay service."
        - name: "provisioning"
          description: "Identifies businesses that are in the process of being activated for the Centrapay service."
        - name: "active"
          description: "Identifies businesses that have been activated for Centrapay services successfully (i.e. they have successfully created a Payment Request)."
        - name: "deactivated"
          description: "Identifies businesses that have been de-registered for the Centrapay service."
          notes:
            - label: "Allowed Reasons"
              value: "data-quality-issues,change-of-ownership, centrapay-discontinued, duplicate, blocked"
        - name: "on-hold"
          description: "Identifies businesses that have been placed on hold."
          notes:
            - label: "Allowed Reasons"
              value: "seasonal-business-closure,  no-response"
  onboardingStatusReason:
    type: string
    description: The reason associated with the [Onboarding Status](#onboarding-statuses). See [Onboarding Status Reasons](#onboarding-status-reasons) for possible values.

    x-values:
      title: "Onboarding Status Reasons"
      entries:
        - name: "duplicate"
          description: "The business already exists in the Centrapay system."
        - name: "data-quality-issues"
          description: "Data quality issues are preventing the business from onboarding."
        - name: "no-response"
          description: "No response has been received from the business."
        - name: "change-of-ownership"
          description: "The business has changed ownership."
        - name: "centrapay-discontinued"
          description: "The business is no longer using Centrapay."
        - name: "seasonal-business-closure"
          description: "The business has closed temporarily."