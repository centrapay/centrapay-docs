x-title: Token Model
x-experimental: true
type: object
properties:
  collectionId:
    type: string
    description: The [Token Collection](#create-token-collection) that will govern the branding and redemption rules for the token. Currently only Collections of type `product` are supported.
  idempotencyKey:
    type: string
    description: Client-supplied identifier that prevents double creation.
  externalId:
    type: string
    description: The asset identifier from the issuing system.
  accountId:
    type: string
    description: The Account to create the token for. Defaults to the Account on the Token Collection.
