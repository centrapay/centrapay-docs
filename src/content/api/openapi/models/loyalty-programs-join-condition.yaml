x-title: Join Condition Model
x-intro: |
  A join condition defines the requirements that an Account must meet to join a Loyalty Program.
type: object
required:
  - type
  - params
properties:
  type:
    type: string
    description: The type of join condition. Valid values are `asset-ownership`, `bank-account-ownership` and `email-domain-verified`.
  params:
    type: object
    description: The parameters for the join condition. The structure depends on the `type` field.
