x-title: Integration Request Model
type: object
properties:
  id:
    type: string
    description: The unique identifier of the Integration Request.
  accountId:
    type: string
    description: The Integration Request's owning Centrapay [Account](/api/accounts/) id.
  merchantId:
    type: string
    description: The [Merchant](/api/merchants) id for the Integration Request.
  type:
    type: string
    description: The type of the Integration Request.
    x-values:
      title: "Integration Types"
      entries:
        - name: "epay"
          description: "Asset provider [ePay](https://www.giftstation.co.nz/)"
        - name: "invenco"
          description: "Terminal vendor [invenco](https://www.invenco.com/)"
        - name: "skyzer"
          description: "Terminal vendor [skyzer](https://www.skyzer.co.nz)"
        - name: "smartpay"
          description: "Terminal vendor [smartpay](https://www.smartpay.co.nz)"
        - name: "verifone"
          description: "Terminal vendor [Verifone](https://www.verifone.com/en/nz)"
        - name: "vista"
          description: "Terminal vendor [vista](https://www.vista.co)"
        - name: "windcave"
          description: "Terminal vendor [Windcave](https://www.windcave.com/)"
        - name: "shopify"
          description: "E-commerce provider [Shopify](https://www.shopify.com/)"
        - name: "epay-pos"
          description: Point of sale [Epay Convenience POS](/guides/compatible-solutions)
        - name: "eftpos-central"
          description: Terminal vendor [Eftpos Central](/guides/compatible-solutions#eftpos-central-group)
        - name: "sektor"
          description: Terminal vendor [Sektor](/guides/compatible-solutions#sektor)
        - name: "nomad"
          description: Centrapay's hardware-free sales channel, [Nomad](/guides/nomad)
        - name: "fat-zebra"
          description: E-commerce provider Fat Zebra
  status:
    type: string
    enum: [pending, active, rejected, deleted]
    description: The current status of the Integration Request.
    x-values:
      entries:
        - name: "pending"
          description: Submitted and waiting to be enabled.
        - name: "active"
          description: Enabled for Centrapay acceptance.
        - name: "rejected"
          description: The Integration Request was declined.
        - name: "deleted"
          description: The Integration Request was deleted.
  terminalId:
    type: string
    description: Epay terminalId for the Integration Request. Required if type is `epay`.
  terminal:
    type: object
    description: The terminal configuration. Required for all terminal vendors except Vista. Refer to [Terminal](#terminal).
    allOf:
      - $ref: './integration-requests-terminal.yaml'
  product:
    type: object
    description: The requested Epay gift card types to support. Refer to [Product](#product).
    allOf:
      - $ref: './integration-requests-product.yaml'
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Integration Request was created.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Integration Request.
  updatedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Integration Request was updated.
  updatedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Integration Request.
  notifiedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Integration Request was submitted to the terminal provider in order to enable the terminal for Centrapay acceptance.
  externalId:
    type: string
    description: The external identifier for the integration. Required for `shopify` integration requests.
