x-title: Product Classification
type: object
properties:
  type:
    type: string
    enum: [GS1]
    description: The classification type. See [GS1 Global Product Classification](https://www.gs1.org/standards/gpc). When `GS1` is used as the product classification type then the product code should be the GPC product brick identifier.
    x-values:
      entries:
        - name: "GS1"
          description: A [GS1 Global Product Classification](https://www.gs1.org/standards/gpc) code.
  code:
    type: string
    description: The classification code.
  name:
    type: string
    description: The classification title.
  props:
    type: object
    description: |
      The product classification properties.
      Classification properties allow optional additional product characterizing attrubutes to be supplied.
      In the case of GS1 product classifications this corresponds to the GPC brick attributes.
