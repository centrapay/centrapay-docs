x-title: Loyalty Program Model
type: object
properties:
  id:
    type: string
    description: The unique identifier of the Loyalty Program.
  name:
    type: string
    description: The display name of the Loyalty Program.
  description:
    type: string
    description: The displayable description for the Loyalty Program.
  mediaUploadId:
    type: string
    description: The id of the [Media Upload](/api/media-uploads/) image of the Loyalty Program.
  img:
    type: string
    description: The img URL of the Loyalty Program.
  accountId:
    type: string
    description: The [Account](/api/accounts/) that will own the Loyalty Program.
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Loyalty Program was created.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Loyalty Program.
  test:
    type: boolean
    description: '`true` if the Loyalty Program is for testing purposes only.'
  status:
    type: string
    description: The status of the Loyalty Program.
    x-values:
      entries:
        - name: "draft"
          description: The Loyalty Program is not ready yet.
        - name: "active"
          description: The Loyalty Program is ready for consumers to start joining and earning.
  memberCount:
    type: string
    description: The number of [Loyalty Program Memberships](/api/loyalty-program-memberships) that have been created for the loyalty program.
  visibility:
    type: string
    enum: [public, unlisted]
    description: The visibility setting for the Loyalty Program.
    x-values:
      entries:
        - name: "public"
          description: Shown with its merchants in merchant search, so customers can discover it.
        - name: "unlisted"
          description: Hidden from merchant search. Customers need a direct link to find it.
  joinConditions:
    type: array
    items:
      $ref: ../models/loyalty-programs-join-condition.yaml
    description: The list of Join Conditions that an Account must meet to join the Loyalty Program.
