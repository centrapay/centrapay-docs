x-title: Batch Model
type: object
properties:
  id:
    type: string
    description: The Batch's unique identifier.
  accountId:
    type: string
    description: The id of the Centrapay [Account](/api/accounts) that submitted the Batch.
  url:
    type: string
    description: The url where the file is located.
  status:
    type: string
    description: The current lifecycle stage of the batch.
    x-values:
      title: "Batch Lifecycle"
      intro: |
        Different stages of a Batch's lifecycle.
        ![Batch Lifecycle](/batch-lifecycle.png)
      entries:
        - name: "created"
          description: "The batch has successfully been submitted."
        - name: "copied"
          description: "The file has been transferred to Centrapay."
        - name: "chunked"
          description: "The batch has been broken up for processing."
        - name: "complete"
          description: "The batch has been processed and may include errors."
        - name: "error"
          description: "There is an error accessing or reading the file, preventing processing."
  type:
    type: string
    description: The Batch Type, which describes the batch content.
    x-values:
      title: "Batch Types"
      entries:
        - name: "[farmlands-external-asset](/api/batch-types/farmlands-external-asset)"
          description: "Farmlands External Asset Batch."
        - name: "[ticketek-ticket](/api/batch-types/ticketek-ticket)"
          description: "Ticketek Ticket Batch."
        - name: "[business-onboard](/api/batch-types/business-onboard)"
          description: "Business Onboard Batch."
        - name: "payap-merchant"
          description: Payap Merchant Batch.
  totalCount:
    type: string
    x-type: bignumber
    description: The number of items processed.
  errorCount:
    type: string
    x-type: bignumber
    description: Total [Error](#error) counted.
  errors:
    type: array
    items:
      $ref: './batch-error.yaml'
    description: '[Error](#error) list for the batch.'
  test:
    type: boolean
    description: true if the batch is for testing purposes only.
