x-title: Merchant Model
type: object
properties:
  id:
    type: string
    description: Merchant's unique identifier.
  accountId:
    type: string
    description: Id of Merchant's owning Centrapay account.
  name:
    type: string
    description: Merchant name.
  country:
    type: string
    description: Merchant [ISO 3166](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code. Must match the "region" on the [Account](/api/accounts).
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Merchant was created.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Merchant.
  updatedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Merchant was updated.
  updatedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Merchant.
  test:
    type: boolean
    description: Flag indicating merchant is for testing.
  settlementConfig:
    type: object
    description: Merchant [Settlement Config](#settlement-config-model).
    allOf:
      - $ref: './settlement-config.yaml'
  type:
    type: string
    enum: [physical, e-commerce]
    description: The type of the Merchant.
    x-values:
      entries:
        - name: "physical"
          description: A merchant with a physical store.
        - name: "e-commerce"
          description: An online only merchant. E-commerce merchants are not displayed in the store finder.
  location:
    type: object
    x-type: location
    description: Physical Location of Merchant. It is highly recommended that you provide this otherwise, users won't be able to find you with our [Merchant Search](#search-merchants) API if they perform a origin + distance query. This field is forbidden when the provided type is `e-commerce`.
  onboardingStatus:
    type: string
    enum:
      - applied
      - provisioning
      - active
      - on-hold
      - deactivated
      - archived
    description: The onboarding status of the Merchant.
    x-values:
      title: "Onboarding Statuses"
      entries:
        - name: "applied"
          description: "Identifies merchants that have registered to be activated for the Centrapay service."
        - name: "provisioning"
          description: "Identifies merchants that are in the process of being activated for the Centrapay service."
        - name: "active"
          description: "Identifies merchants that have been activated for Centrapay services successfully (i.e. they have successfully created a Payment Request)."
        - name: "deactivated"
          description: "Identifies merchants that have been de-registered for the Centrapay service."
          notes:
            - label: "Allowed Reasons"
              value: "duplicate, data-quality-issues, change-of-ownership, centrapay-discontinued-opt-out, blocked, company-closed, tid-cancelled"
        - name: "on-hold"
          description: "Identifies merchants that have been placed on hold."
          notes:
            - label: "Allowed Reasons"
              value: "seasonal-business-closure, incompatible-terminal, no-response"
        - name: "archived"
          description: "Identifies merchants that have been archived. Archived merchants are not returned when listing Merchants."
          notes:
            - label: "Allowed Reasons"
              value: "duplicate, data-quality-issues, change-of-ownership, centrapay-discontinued-opt-out, blocked, company-closed, tid-cancelled"
  onboardingStatusReason:
    type: string
    enum:
      - seasonal-business-closure
      - incompatible-terminal
      - no-response
      - data-quality-issues
      - change-of-ownership
      - centrapay-discontinued-opt-out
      - duplicate
      - blocked
      - company-closed
      - tid-cancelled
    description: The reason for the Merchant's onboarding status.
    x-values:
      title: "Onboarding Status Reasons"
      entries:
        - name: "duplicate"
          description: "The merchant already exists in the Centrapay system."
        - name: "data-quality-issues"
          description: "Data quality issues are preventing the merchant from onboarding."
        - name: "no-response"
          description: "No response has been received from the merchant."
        - name: "change-of-ownership"
          description: "The merchant has changed ownership."
        - name: "centrapay-discontinued-opt-out"
          description: "The merchant or partner has requested cancellation of Centrapay."
        - name: "blocked"
          description: "The merchant has been blocked."
        - name: "company-closed"
          description: "The merchant's business has closed."
        - name: "tid-cancelled"
          description: "The merchant's terminal has been cancelled."
        - name: "seasonal-business-closure"
          description: "The merchant has closed temporarily."
        - name: "incompatible-terminal"
          description: "The merchant does not have any compatible terminals."
  categoryCode:
    type: string
    description: The category code assigned to the Merchant by Centrapay. Must be 4 digits.
  metadata:
    type: object
    description: Arbitrary key-value data associated with the Merchant. See [Set Merchant Metadata](#set-merchant-metadata).
    additionalProperties:
      type: string
