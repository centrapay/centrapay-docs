x-title: Merchant Model
type: object
properties:
  id:
    type: string
    description: Merchant's unique identifier.
  accountId:
    type: string
    description: Id of Merchant's owning Centrapay account.
  name:
    type: string
    description: Merchant name.
  country:
    type: string
    description: Merchant [ISO 3166](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code. Must match the "region" on the [Account](/api/accounts).
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Merchant was created.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Merchant.
  updatedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Merchant was updated.
  updatedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Merchant.
  test:
    type: boolean
    description: Flag indicating merchant is for testing.
  settlementConfig:
    type: object
    description: Merchant [Settlement Config](#settlement-config-model).
    allOf:
      - $ref: './settlement-config.yaml'
  type:
    type: string
    enum:
      - physical
      - e-commerce
    description: 'Valid values: `physical` or `e-commerce`. Merchants with a physical store should provide type `physical`. Online only merchants should provide type `e-commerce`. E-commerce merchants will not be displayed in the store finder.'
  location:
    type: object
    x-type: location
    description: Physical Location of Merchant. It is highly recommended that you provide this otherwise, users won't be able to find you with our [Merchant Search](#search-merchants) API if they perform a origin + distance query. This field is forbidden when the provided type is `e-commerce`.
  onboardingStatus:
    type: string
    enum:
      - applied
      - provisioning
      - active
      - on-hold
      - deactivated
      - archived
    description: The onboarding status of the Merchant. See [Onboarding Statuses](#onboarding-statuses) for possible values.
  onboardingStatusReason:
    type: string
    enum:
      - seasonal-business-closure
      - incompatible-terminal
      - no-response
      - data-quality-issues
      - change-of-ownership
      - centrapay-discontinued-opt-out
      - duplicate
      - blocked
      - company-closed
      - tid-cancelled
    description: The reason associated with the [Onboarding Status](#onboarding-statuses). See [Onboarding Status Reasons](#onboarding-status-reasons) for possible values.
  categoryCode:
    type: string
    description: The category code assigned to the Merchant by Centrapay. Must be 4 digits.
  metadata:
    type: object
    description: Arbitrary key-value data associated with the Merchant. See [Set Merchant Metadata](#set-merchant-metadata).
    additionalProperties:
      type: string
