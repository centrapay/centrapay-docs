x-title: Managed Integration Model
type: object
properties:
  id:
    type: string
    description: The Managed Integration's unique identifier.
  type:
    type: string
    enum:
      - paypal-referral
      - payap
    description: The type of Managed Integration.
    x-values:
      entries:
        - name: "paypal-referral"
          description: Onboards a merchant to PayPal by emailing them a PayPal partner referral link.
        - name: "payap"
          description: Sets up a Payap merchant from partner-supplied business, merchant, bank and terminal details.
  enabled:
    type: boolean
    description: Flag indicating whether the Managed Integration should become active or inactive.
  status:
    type: string
    enum: [created, pending, provisioning, active, inactive, archived]
    description: Current status of the Managed Integration.
    x-values:
      entries:
        - name: "created"
          description: Just created and not yet being set up.
        - name: "pending"
          description: Being set up. For PayPal, waiting for the merchant to complete the referral.
        - name: "provisioning"
          description: Being set up with the provider.
        - name: "active"
          description: Set up and live.
        - name: "inactive"
          description: Set up but disabled.
        - name: "archived"
          description: No longer in use, eg because the PayPal referral link expired.
  externalId:
    type: string
    description: Field used to reference an id from an external system.
  params:
    type: object
    description: '[Params](#params-model) depending on the Managed Integration type.'
    allOf:
      - $ref: './managed-integrations-params.yaml'
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Managed Integration was created.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Managed Integration.
  updatedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Managed Integration was updated.
  updatedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Managed Integration.
  claimedByAccountId:
    type: string
    description: Centrapay account id used to claim the Managed Integration.
  claimedBy:
    type: string
    x-type: crn
    description: The User or API Key that claimed the Managed Integration.
  claimedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Managed Integration was claimed.
  invitation:
    type: object
    description: A summary of the associated [Invitation](/api/invitations). See [Invitation Summary](#invitation-summary-model).
    allOf:
      - $ref: './managed-integrations-invitation-summary.yaml'
  inProgress:
    type: boolean
    description: Flag indicating whether a status transition is in progress.
  test:
    type: boolean
    description: A flag which is present if the Managed Integration is for testing.
