x-title: Invitation Model
type: object
properties:
  id:
    type: string
    description: The Invitation's unique identifier.
  code:
    type: string
    description: The Invitation code.
  type:
    type: string
    enum: [account-membership]
    description: The type of invitation.
    x-values:
      entries:
        - name: "account-membership"
          description: Invites the recipient to become a member of an [Account](/api/accounts).
  resourceId:
    type: string
    description: The id of the related resource.
  resourceType:
    type: string
    enum: [account]
    description: The type of the related resource.
    x-values:
      entries:
        - name: "account"
          description: The related resource is an [Account](/api/accounts).
  expiresAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Invitation expires.
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Invitation was created.
  createdBy:
    type: string
    x-type: crn
    description: The User or API Key that created the Invitation.
  updatedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Invitation was updated.
  updatedBy:
    type: string
    x-type: crn
    description: The User or API Key that updated the Invitation.
  accepted:
    type: boolean
    description: A flag indicating whether the Invitation has been accepted.
  acceptedAt:
    type: string
    format: date-time
    x-type: timestamp
    description: When the Invitation was accepted.
  acceptedBy:
    type: string
    x-type: crn
    description: The User or API Key that accepted the Invitation.
  acceptedByAccountId:
    type: string
    description: The [Account](/api/accounts) id of the user accepting the Invitation.
  recipientAlias:
    type: string
    description: The email address of the user accepting the Invitation.
  params:
    type: object
    description: '[Params](#params-model) dependent on the Invitation type.'
    allOf:
      - $ref: './invitations-params.yaml'
  status:
    type: string
    enum: [created, sent, accepted, revoked]
    description: The status of the invitation.
    x-values:
      entries:
        - name: "created"
          description: The invitation has been created and its email hasn't been sent yet.
        - name: "sent"
          description: The invitation email has been sent and is waiting for the recipient to accept it.
        - name: "accepted"
          description: The recipient has accepted the invitation.
        - name: "revoked"
          description: The invitation was cancelled and can no longer be accepted or resent.
