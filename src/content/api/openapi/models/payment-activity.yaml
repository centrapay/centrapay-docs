x-title: Payment Activity Model
x-intro: |
  A Payment Activity records a transaction that has happened on a Payment Request.
  Payment Activities are created when a Payment Request has been `created`, `paid`, `refunded`, `cancelled`, or `expired`.
type: object
properties:
  id:
    type: string
    description: The unique identifier of the Payment Activity.
  type:
    type: string
    description: The type of Payment Activity.
    x-values:
      title: "Payment Activity Types"
      entries:
        - name: "request"
          description: "Payment Request was created."
        - name: "preAuthRequest"
          description: "Payment Request was created with the `preAuth` flag set to \"true\"."
        - name: "paid"
          description: "Payment Request was paid."
        - name: "payment"
          description: "A payment was made towards the Payment Request."
        - name: "refund"
          description: "Funds were returned to the shopper."
        - name: "cancellation"
          description: "Payment Request was cancelled by the merchant or the shopper."
        - name: "expiry"
          description: "Payment Request wasn't paid before time out."
        - name: "accept-condition"
          description: "A Payment Condition was accepted."
        - name: "decline-condition"
          description: "A Payment Condition was declined."
        - name: "authorization"
          description: "A Pre Auth Payment Request was approved and confirmations can be made against it."
        - name: "confirmation"
          description: "Funds on a Pre Auth have been drawn down on."
        - name: "release"
          description: "Pre Auth has been finalised and any remaining funds from Authorization have been returned."
  value:
    x-type: monetary
    type: object
    description: The value of the Payment Activity. Must be less than 100000000 and positive.
    properties:
      amount:
        type: string
      currency:
        type: string
  paymentRequestId:
    type: string
    description: The Payment Request's id.
  merchantId:
    $ref: './merchant.yaml#/properties/merchantId'
  merchantConfigId:
    type: string
    description: The Payment Request's [Merchant Config](/api/merchant-configs) id.
  merchantAccountId:
    type: string
    description: The Payment Request's Merchant [Account](/api/accounts) id.
  merchantName:
    $ref: './merchant.yaml#/properties/merchantName'
  createdAt:
    type: string
    format: date-time
    example: '2021-06-12T01:17:00.000Z'
    description: When the activity was created.
  createdBy:
    x-type: crn
    type: string
    description: The identity that created the activity.
  paymentRequestCreatedBy:
    x-type: crn
    type: string
    description: The identity that created the Payment Request.
  activityNumber:
    x-type: bignumber
    type: string
    description: Unique sequential number for the activity.
  shortCode:
    type: string
    description: A shorter id that can be used for up to two years.
  assetType:
    type: string
    description: The Asset Type for the `payment` or `refund` activity.
  external:
    type: boolean
    description: '`true` if the Payment Activity is recording a transaction that occurred outside the Centrapay system.'
  cancellationReason:
    $ref: './payment-request.yaml#/properties/cancellationReason'
  conditionId:
    type: integer
    description: The id of a Condition if the activity was for a Condition being accepted or declined.
  idempotencyKey:
    type: string
    description: Required when confirming a Payment Request. This is an identifier from your system to enforce uniqueness.
  confirmationIdempotencyKey:
    type: string
    description: Required when refunding a Pre Auth Confirmation. Should be the same as the idempotencyKey used for Confirmation.
  preAuth:
    type: boolean
    description: '`true` if the related Payment Request is a Pre Auth.'
  paidBy:
    type: object
    description: Shows the Paid By - a summary of the transactions - when a Payment Request is paid.
    allOf:
      - $ref: './paid-by.yaml'
  strategy:
    type: object
    description: Details about the specifics for a refund.
    allOf:
      - $ref: './strategy.yaml'
