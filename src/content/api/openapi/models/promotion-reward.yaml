x-title: Promotion Reward Model
type: object
properties:
  assetType:
    type: string
    description: The [assetType](/api/asset-types) to reward.
  collectionId:
    type: string
    description: The ID of the [Token Collection](/api/tokens#token-collection-model) that should be rewarded. Only supplied if `assetType` is `centrapay.token.test` or `centrapay.token.main`.
  name:
    type: string
    description: The name of the [Token Collection](/api/tokens#token-collection-model) that is being rewarded.
  img:
    type: string
    description: The image of the [Token Collection](/api/tokens#token-collection-model) that is being rewarded.
  amount:
    type: string
    x-type: bignumber
    description: The amount of the chosen asset to reward. Only supplied if Promotion is type `challenge`.
  totalSupply:
    type: string
    description: The total number of rewards to be issued.
  remainingSupply:
    type: string
    description: The remaining number of rewards to be issued.
  issued:
    type: boolean
    description: When the promotion is completed, `issued` shows whether the reward was issued to the account.
  issuedToAccountIds:
    type: array
    items:
      type: string
    description: The IDs of the accounts this reward was issued to. Only supplied once the draw for a `draw` Promotion has been run. An empty array means the reward went unclaimed. Where a reward is grouped with `and`, every reward in the group lists the same accounts, since a winner of that group receives all of them.
