x-title: Asset Program Model
type: object
required:
  - assetProgramId
properties:
  assetProgramId:
    type: string
    description: The unique identifier of the asset program that the business will accept (max 35 characters).
  params:
    type: object
    x-flatten: true
    properties:
      settlementAccountNumber:
        type: string
        description: The settlement bank account in the format `XX-XXXX-XXXXXXX-XXX` (18-19 digits).
      chargeAccountNumber:
        type: string
        description: The billing bank account in the format `XX-XXXX-XXXXXXX-XXX` (18-19 digits). Defaults to settlement account if omitted. Only allowed if `settlementAccountNumber` is also provided.
      externalMerchantId:
        type: string
        description: Merchant identifier in the partner system (max 35 characters). If omitted, Centrapay will assign one.
