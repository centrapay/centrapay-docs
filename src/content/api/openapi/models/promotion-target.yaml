x-title: Promotion Target Model
type: object
properties:
  type:
    type: string
    description: How progress towards the target is counted.
    x-values:
      entries:
        - name: "count"
          description: Progress is incremented by 1 each time.
        - name: "sum"
          description: Progress is summed from the specified `field` property.
        - name: "shared"
          description: Progress is shared with other accounts that have memberships to the same Promotion.
  field:
    type: string
    description: Only supplied if `type` is `sum`. This denotes which field to sum on the [Event](/api/events) to reach the target amount.
  amount:
    type: string
    x-type: bignumber
    description: The chosen number to reach for completion of the Promotion.
  progress:
    type: string
    x-type: bignumber
    description: The shared progress of the Promotion.
