x-title: Wallet Assets Model
type: object
properties:
  id:
    type: string
    description: The unique identifier of the Wallet Asset.
  accountId:
    type: string
    description: The Wallet Asset's owning Centrapay [Account](/api/accounts/) id.
  category:
    type: string
    description: Asset category.
    x-values:
      entries:
        - name: "money"
          description: A currency balance, such as an NZD wallet.
        - name: "token"
          description: A Token asset, eg a product or loyalty token.
  type:
    type: string
    description: '[Asset Type](/api/asset-types) id used by payment option asset types.'
  liveness:
    type: string
    description: Whether the asset can be used for live payments.
    x-values:
      entries:
        - name: "main"
          description: Live payments allowed.
        - name: "test"
          description: Test payments only.
  description:
    type: string
    description: Displayable asset description.
  createdAt:
    type: string
    format: date-time
    x-type: timestamp
    description: Timestamp at which the Wallet Asset was created.
  status:
    type: string
    description: '`active` if the Wallet Asset can be used for payments.'
  currency:
    type: string
    description: Currency code, eg "NZD".
  balance:
    type: string
    x-type: bignumber
    description: Current balance in the currency's smallest denomination (ie. cents).
  availableBalance:
    type: string
    x-type: bignumber
    description: The balance of the asset that is available for transfers or purchases.
  settlement:
    type: boolean
    x-experimental: true
    description: '`true` if the Wallet Asset is a [Settlement Wallet Asset](#settlement-wallet-assets).'

    x-table:
      title: "Settlement Wallet Assets"
      body: |
        A Settlement Wallet Asset is a special type of Wallet Asset that can only receive or refund money related to a [Payment Request](/api/payment-requests). This means you cannot top up, withdraw, or send money from this Wallet Asset.