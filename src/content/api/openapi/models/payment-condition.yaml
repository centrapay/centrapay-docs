x-title: Payment Condition Model
type: object
properties:
  id:
    x-type: bignumber
    type: string
    description: An enumerated identifier for the Payment Condition.
  name:
    type: string
    description: The name of the condition.
  message:
    type: string
    description: The human-readable description of the condition.
  status:
    type: string
    enum: [awaiting-merchant, accepted, declined]
    description: The status of the condition.
    x-values:
      entries:
        - name: "awaiting-merchant"
          description: Waiting for the merchant to perform the check, eg photo ID or signature.
        - name: "accepted"
          description: The merchant confirmed the check and payment can proceed.
        - name: "declined"
          description: The merchant declined the check, and the Payment Request is cancelled.
