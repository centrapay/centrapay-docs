    body: |
      Types of bank accounts to allow access to different [Asset Types](/api/asset-types).

      |   Type    |                          Description                           |
      | --------- | -------------------------------------------------------------- |
      | centrapay | Allows topup and withdrawal of the `centrapay.nzd` asset type. |
      | quartz    | Allows usage of the `quartz.nzd` asset type.                   |
