  - endpoint: getAssetTransfer
  - endpoint: getAssetTransferSummary
  - endpoint: claimAssetTransfer
  - endpoint: resolveClaimableAssets
  - endpoint: listAssetTransfers
  - endpoint: cancelAssetTransfer
