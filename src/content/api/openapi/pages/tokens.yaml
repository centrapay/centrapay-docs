title: Tokens
description: Token endpoints
nav:
  path: Assets
  order: 5
intro: |
  Tokens are [Assets](/api/assets/) which can only be spent in full.

  Every [Token](/api/tokens/create-token/) is associated with a [Collection](/api/tokens/create-token-collection/), which defines the branding and general rules for the Tokens, such as active duration.

  A [Redemption Condition](/api/tokens/create-redemption-condition/) is created for each [Merchant](/api/merchants) that accepts Tokens from a Collection, and contains additional conditions specific to that Merchant, such as redeemable product identifiers.
sections:
