get:
  x-method: GET
  x-path: /api/businesses/onboard/{id}
  operationId: getOnboardingRequest
  summary: Get an Onboarding Request
  description: |
    This endpoint retrieves an existing onboarding request by its ID.

    ### Required Permissions

    The API key must have the `onboarding-request:read` permission for the account that created the onboarding request.
  tags:
    - onboarding
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      example: bo_8xKfR3vPq2NmTcWzYhJ7Ue
      description: The onboarding request ID, prefixed with `bo_`.
  responses:
    '200':
      description: Onboarding Request retrieved
      content:
        application/json:
          schema:
            $ref: ../models/onboarding-request.yaml
          examples:
            default:
              value:
                id: bo_8xKfR3vPq2NmTcWzYhJ7Ue
                legalName: Centrapay Cafe Limited
                tradingName: Centrapay Cafe
                location:
                  street: 1 Head Office Way
                  city: Wellington
                  state: Wellington
                  postCode: '6011'
                  country: NZ
                contactEmail: admin@centracafe.example
                contactName: Alice Anderson
                externalId: ext-cafe-001
                taxNumber:
                  value: 123-456-789
                  type: nz-gst
                merchant:
                  name: Centrapay Cafe
                  categoryCode: '5812'
                  type: physical
                  contactName: Bob Brown
                  contactEmail: manager@centracafe.example
                  contactPhone: '6491234567'
                  location:
                    street: 123 Example Street
                    suburb: Newtown
                    city: Wellington
                    state: Wellington
                    postCode: '6021'
                    country: NZ
                assetProgram:
                  assetProgramId: YGRo6TYYSxH3js7
                  params:
                    settlementAccountNumber: 12-3456-7890123-00
                    chargeAccountNumber: 12-3456-7890123-01
                    externalMerchantId: ext-merchant-789
                salesChannels:
                  - params:
                      vendor: verifone
                      reseller: Example Reseller
                      deviceId: device-001
                      serialNumber: SN123456
                      deviceModel: Verifone P630
                  - params:
                      vendor: verifone
                      reseller: Example Reseller
                      deviceId: device-002
                      serialNumber: SN123457
                      deviceModel: Verifone P630
                metadata:
                  referenceId: ref-12345
                  notes: Onboarding request submitted via partner portal
                sendInvitation: true
                status: pending
                createdAt: '2025-07-25T10:30:00.000Z'
                createdBy: crn:Jaim1Cu1Q55uooxSens6yk:api-key:MyApiKey
