post:
  x-method: POST
  x-path: /api/asset-program-memberships/{id}/asset-program-configs
  x-experimental: true
  operationId: createAssetProgramConfig
  summary: Create Asset Program Config
  description: |
    This endpoint allows you to create an Asset Program Config for an Asset Program Membership. If an Asset Program Config already exists for the Merchant and Asset Program, the existing config is returned.
  tags:
    - asset-program-configs
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      example: apm_Xv990BzkgfoDS7bBls50pd
      description: The id of the [Asset Program Membership](/api/asset-program-memberships) to create the config for.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - merchantId
          properties:
            merchantId:
              type: string
              description: The id of the [Merchant](/api/merchants) to associate with the config.
        examples:
          default:
            value:
              merchantId: 5ee0c486308f590260d9a07f
  responses:
    '200':
      description: Asset Program Config created
      content:
        application/json:
          schema:
            $ref: ../models/asset-program-config.yaml
          examples:
            default:
              value:
                id: apc_WRhAxxWpTKb5U7pXyxQjjY
                accountId: Jaim1Cu1Q55uooxSens6yk
                assetProgramId: ap_WRhAxxWpTKb5U7pXyxQjjY
                assetProgramMembershipId: apm_Xv990BzkgfoDS7bBls50pd
                merchantId: 5ee0c486308f590260d9a07f
                enabled: true
                status: pending
                test: false
                createdAt: '2021-08-25T00:02:49.488Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                updatedAt: '2021-08-25T00:02:49.488Z'
                updatedBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
