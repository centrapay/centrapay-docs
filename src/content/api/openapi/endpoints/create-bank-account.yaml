post:
  x-method: POST
  x-path: /api/bank-accounts
  operationId: createBankAccount
  summary: Create Bank Account
  description: |
    A Bank Account can be created with or without direct debit authorized. By including
    `directDebitAuthority`, the user accepts our [Direct Debit terms](https://centrapay.com/directdebit-termsandconditions/)
    and has authority to operate this account.

    `phoneNumber`, `fullName` and `emailAddress` are all required to create a direct-debit authority. This is required to be able to Top Up a Bank Account.
  tags:
    - bank-accounts
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - accountId
            - bankAccountNumber
            - bankAccountName
          properties:
            accountId:
              type: string
              description: The id of the owning Centrapay [Account](/api/accounts).
            bankAccountNumber:
              type: string
              description: The user's Bank Account number.
            bankAccountName:
              type: string
              description: The name on the Bank Account provided by the user.
            directDebitAuthority:
              type: object
              description: A [direct-debit authority](#add-direct-debit-authority-to-a-bank-account). By including `directDebitAuthority`, the user accepts our [Direct Debit terms](https://centrapay.com/directdebit-termsandconditions/) and has authority to operate this account.
            type:
              $ref: '../models/bank-account.yaml#/properties/type'
            test:
              type: boolean
              description: A flag which is present if the Bank Account is for testing.
        examples:
          default:
            value:
              accountId: Jaim1Cu1Q55uooxSens6yk
              bankAccountNumber: 12-1234-1234567-123
              bankAccountName: John Doe
              directDebitAuthority:
                phoneNumber: '+64212345678'
                fullName: John Doe
                emailAddress: john.doe@gmail.com
  responses:
    '200':
      description: Bank Account created
      content:
        application/json:
          schema:
            $ref: ../models/bank-account.yaml
          examples:
            default:
              value:
                id: WRhAxxWpTKb5U7pXyxQjjY
                accountId: Jaim1Cu1Q55uooxSens6yk
                bankAccountNumber: 12-1234-1234567-123
                bankAccountName: John Doe
                directDebitAuthorized: true
                status: created
                verified: false
                type: centrapay
                createdAt: '2020-06-12T01:17:46.499Z'
                createdBy: crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey
                modifiedAt: '2020-06-12T01:17:46.499Z'
                modifiedBy: crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey
                approvals: []
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            BANK_ACCOUNT_LIMIT_EXCEEDED:
              description: The Centrapay account already has the max amount of directDebitAuthorized enabled Bank Accounts.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_ACCOUNT_LIMIT_EXCEEDED
            BANK_ACCOUNT_HOLDER_LIMIT_EXCEEDED:
              description: The global maximum Bank Accounts for the provided Bank Account number has been reached.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_ACCOUNT_HOLDER_LIMIT_EXCEEDED
            DUPLICATE_BANK_ACCOUNT:
              description: The Centrapay account already holds this Bank Account.
              value:
                statusCode: 403
                error: Forbidden
                message: DUPLICATE_BANK_ACCOUNT
