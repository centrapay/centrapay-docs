              value:
                id: AVH5uG4gRLYK6YR8JyrViN
                accountId: C4QnjXvj8At6SMsEN4LRi9
                url: https://sabtestcardcomcentrapay.blob.core.windows.net/outbound/1234
                status: complete
                type: farmlands-external-asset
                test: true
                totalCount: '160000'
                errorCount: '1'
