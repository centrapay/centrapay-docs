post:
  x-method: POST
  x-path: /api/bank-authorities/{bankAccountId}/verify
  deprecated: true
  operationId: verifyBankAuthority
  summary: Verify Bank Authority
  description: |
    If you're creating new interfaces, please work with [Verify Bank Account](#verify-bank-account).
  tags:
    - bank-accounts
  parameters:
    - name: bankAccountId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Bank Account id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - verificationCode
          properties:
            verificationCode:
              type: string
              description: The code on the user’s bank statement.
        examples:
          default:
            value:
              verificationCode: '1111'
  responses:
    '200':
      description: Bank Authority verified
      content:
        application/json:
          schema:
            type: object
            properties:
              verificationCode:
                type: string
          examples:
            default:
              value:
                verificationCode: '1111'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            BANK_AUTHORITY_ALREADY_VERIFIED:
              description: The bank account is already verified.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_AUTHORITY_ALREADY_VERIFIED
            BANK_AUTHORITY_VERIFICATION_ATTEMPTS_EXCEEDED:
              description: The bank account's maximum failed verification attempts has been reached.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_AUTHORITY_VERIFICATION_ATTEMPTS_EXCEEDED
            BANK_AUTHORITY_ACCOUNT_MISMATCH:
              description: The top up / withdrawal and the bank account do not belong to the same account.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_AUTHORITY_ACCOUNT_MISMATCH
