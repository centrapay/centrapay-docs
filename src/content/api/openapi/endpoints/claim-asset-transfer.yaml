post:
  x-method: POST
  x-path: /api/asset-transfers/{assetTransferId}/claim
  x-experimental: true
  operationId: claimAssetTransfer
  summary: Claim Asset Transfer
  description: |
    Claim the asset transfer for the caller's authorised account.
  tags:
    - asset-transfers
  parameters:
    - name: assetTransferId
      in: path
      required: true
      schema:
        type: string
      example: M7Kn2stAxNa6ri7h
      description: The Asset Transfer id.
  responses:
    '200':
      description: Asset Transfer claimed
      content:
        application/json:
          schema:
            $ref: ../models/asset-transfer.yaml
          examples:
            default:
              value:
                id: M7Kn2stAxNa6ri7h
                status: claimed
                value: '6000'
                assetId: YGRo6TYYSxH3js7
                description: $60 Giftcard
                message: Happy birthday
                senderName: My Cafe
                senderAccountId: aBc932S9182qwCDqwer
                recipientAccountId: 9EDxUT91TMsUjoqoQeBuLQ
                claimedByAccountId: 9EDxUT91TMsUjoqoQeBuLQ
                createdAt: '2020-05-01T12:30:00.000Z'
                updatedAt: '2020-05-02T01:03:37.222Z'
                suppressNotifications: false
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            ASSET_TRANSFER_INVALID_RECIPIENT:
              description: The asset transfer already has a recipient defined through the `recipientAlias` field and cannot be claimed with this API.
              value:
                statusCode: 403
                error: Forbidden
                message: ASSET_TRANSFER_INVALID_RECIPIENT
            ASSET_TRANSFER_INVALID_STATUS:
              description: The asset transfer is not in a `sent` status and hence cannot be claimed.
              value:
                statusCode: 403
                error: Forbidden
                message: ASSET_TRANSFER_INVALID_STATUS
            ASSET_TRANSFER_CLAIM_CONDITIONS_NOT_MET:
              description: The claim has failed because one or more of the claim conditions were not met.
              value:
                statusCode: 403
                error: Forbidden
                message: ASSET_TRANSFER_CLAIM_CONDITIONS_NOT_MET
