post:
  x-method: POST
  x-path: /api/collections/{collectionId}/redemption-conditions
  x-experimental: true
  operationId: createRedemptionCondition
  summary: Create Redemption Condition
  description: |
    This endpoint allows you to create a Redemption Condition. Redemption conditions are only created for [Token Collections](/api/tokens/create-token-collection/) of type `product`.
  tags:
    - tokens
  parameters:
    - name: collectionId
      in: path
      required: true
      schema:
        type: string
      example: c_NFhUgPQEYbk2EbTXAYArTX
      description: The Token Collection id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - merchantId
            - allowedProducts
          properties:
            merchantId:
              type: string
              description: The identifier of the [Merchant](/api/merchants) that is accepting the collection.
            allowedProducts:
              type: array
              items:
                $ref: ../models/allowed-products.yaml
              description: List of Allowed Products.
        examples:
          default:
            value:
              merchantId: 36EALpZ89XpShxM2Ee9sXT
              allowedProducts:
                - sku: '100001'
                  name: White Bread
                  maxValue:
                    currency: NZD
                    amount: '400'
                - sku: '100002'
                  name: Sourdough Bread
                  maxValue:
                    currency: NZD
                    amount: '800'
  responses:
    '200':
      description: Redemption Condition created
      content:
        application/json:
          schema:
            $ref: ../models/redemption-condition.yaml
          examples:
            default:
              value:
                id: DKTs3U38hdhfEqwF1JKoT2
                merchantId: 36EALpZ89XpShxM2Ee9sXT
                collectionId: c_NFhUgPQEYbk2EbTXAYArTX
                allowedProducts:
                  - sku: '100001'
                    name: White Bread
                    maxValue:
                      currency: NZD
                      amount: '400'
                  - sku: '100002'
                    name: Sourdough Bread
                    maxValue:
                      currency: NZD
                      amount: '800'
                createdAt: '2022-05-12T04:30:11.001Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                updatedAt: '2022-05-12T04:30:11.001Z'
                updatedBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            INVALID_AMOUNT:
              description: One or more of the maxValue amount in the products has exceeded the maxValue amount defined on the collection.
              value:
                statusCode: 403
                error: Forbidden
                message: INVALID_AMOUNT
            REDEMPTION_CONDITION_ALREADY_EXISTS:
              description: A redemption condition for the collection and the merchant has already been created.
              value:
                statusCode: 403
                error: Forbidden
                message: REDEMPTION_CONDITION_ALREADY_EXISTS
            COLLECTION_INVALID_TYPE:
              description: Redemption conditions can only be created for collections of type `product`.
              value:
                statusCode: 403
                error: Forbidden
                message: COLLECTION_INVALID_TYPE
