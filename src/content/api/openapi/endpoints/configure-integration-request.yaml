put:
  x-method: PUT
  x-path: /api/integration-requests/{integrationRequestId}/configs
  x-experimental: true
  operationId: configureIntegrationRequest
  summary: Configure Integration Request
  description: This endpoint allows you to supply configuration values for the Integration Request.
  tags:
    - integration-requests
  parameters:
    - name: integrationRequestId
      in: path
      required: true
      schema:
        type: string
      example: DKTs3U38hdhfEqwF1JKoT2
      description: The Integration Request id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            terminalId:
              type: string
              description: Epay terminalId for the Integration Request. Required if type is `epay`.
        examples:
          default:
            value:
              terminalId: '11000021'
  responses:
    '200':
      description: Integration Request configured
      content:
        application/json:
          schema:
            $ref: '../models/integration-request.yaml'
          examples:
            default:
              value:
                id: DKTs3U38hdhfEqwF1JKoT2
                accountId: Jaim1Cu1Q55uooxSens6yk
                merchantId: 5ee0c486308f590260d9a07f
                type: epay
                status: pending
                terminalId: '11000021'
                createdAt: '2020-06-12T01:17:46.499Z'
                updatedAt: '2020-06-12T01:17:46.499Z'
                createdBy: 'crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey'
                updatedBy: 'crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey'
                product:
                  name: koha-card
get:
  x-method: GET
  x-path: /api/integration-requests/{integrationRequestId}/configs
  x-experimental: true
  operationId: getIntegrationRequestConfig
  summary: Get Integration Request Configuration
  description: This endpoint allows you to get the configuration values for the Integration Request.
  tags:
    - integration-requests
  parameters:
    - name: integrationRequestId
      in: path
      required: true
      schema:
        type: string
      example: DKTs3U38hdhfEqwF1JKoT2
      description: The Integration Request id.
  responses:
    '200':
      description: Integration Request configuration retrieved
      content:
        application/json:
          schema:
            type: object
            properties:
              terminalId:
                type: string
          examples:
            default:
              value:
                terminalId: '11000021'
