post:
  x-method: POST
  x-path: /api/loyalty-programs/{loyaltyProgramId}/activate
  x-experimental: true
  operationId: activateLoyaltyProgram
  summary: Activate Loyalty Program
  description: |
    Allows the user to set the status of the Loyalty Program to `active`.
  tags:
    - loyalty-programs
  parameters:
    - name: loyaltyProgramId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Loyalty Program id.
  responses:
    '200':
      description: Loyalty Program activated
      content:
        application/json:
          schema:
            $ref: ../models/loyalty-program.yaml
          examples:
            default:
              value:
                id: WRhAxxWpTKb5U7pXyxQjjY
                name: Centrapay Cafe Loyalty Program
                description: 'Centrapay Cafe Loyalty: Earn rewards, enjoy perks! Join now!'
