get:
  x-method: GET
  x-path: /api/payment-requests/short-code/CP-C7F-ZS5
  operationId: getPaymentRequestByShortCode
  summary: Get a Payment Request by Short Code
  description: Returns the latest Payment Request that matches the given short code.
  tags:
    - payment-requests
  parameters:
    - name: shortCode
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Payment Request retrieved
      content:
        application/json:
          schema:
            $ref: '../models/payment-request.yaml'
          examples:
            default:
              value:
                id: MhocUmpxxmgdHjr7DgKoKw
                shortCode: CP-C7F-ZS5
                url: https://app.centrapay.com/pay/MhocUmpxxmgdHjr7DgKoKw
                patronCodeId: V17FByEP9gm1shSG6a1Zzx
                barcode: '9990001234567895'
                merchantId: 26d3Cp3rJmbMHnuNJmks2N
                merchantName: Centrapay Café
                configId: 5efbe2fb96c08357bb2b9242
                value:
                  currency: NZD
                  amount: '100'
                paymentOptions:
                  - amount: '100'
                    assetType: centrapay.nzd.test
                merchantConditions: []
                status: new
                createdAt: '2021-06-08T04:04:27.426Z'
                updatedAt: '2021-06-08T04:04:27.426Z'
                expiresAt: '2021-06-08T04:06:27.426Z'
                liveness: test
                expirySeconds: 120
                connectionId: cn_9asd9k19
                connectionStatus: active
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '../index.yaml#/components/schemas/ApiError'
          examples:
            CHECKSUM_FAILED:
              description: Luhn checksum digit doesn't pass.
              value:
                message: CHECKSUM_FAILED
