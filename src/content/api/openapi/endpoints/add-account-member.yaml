post:
  x-method: POST
  x-path: /api/accounts/{accountId}/members
  x-experimental: true
  operationId: addAccountMember
  summary: Add Member
  description: This endpoint allows you to add or update the membership of a user to an account.
  tags:
    - account-memberships
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
      example: Jaim1Cu1Q55uooxSens6yk
      description: The Account id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - userId
            - role
          properties:
            userId:
              type: string
              description: The id of the user the Membership belongs to.
            role:
              type: string
              description: The role governing Membership permissions.
        examples:
          default:
            value:
              userId: da75ad90-9a5b-4df0-8374-f48b3a8fbfcc
              role: account-owner
  responses:
    '200':
      description: Member added
      content:
        application/json:
          schema:
            $ref: '../models/account-membership.yaml'
          examples:
            default:
              value:
                accountId: Jaim1Cu1Q55uooxSens6yk
                userId: da75ad90-9a5b-4df0-8374-f48b3a8fbfcc
                role: account-owner
                createdBy: crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey
                createdAt: '2020-06-12T01:17:46.499Z'
                modifiedAt: '2020-06-12T01:17:46.499Z'
                modifiedBy: crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey
get:
  x-method: GET
  x-path: /api/accounts/{accountId}/members
  operationId: listAccountMembers
  summary: List members
  description: This endpoint allows you to retrieve the list memberships to an account.
  tags:
    - account-memberships
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
      example: Jaim1Cu1Q55uooxSens6yk
      description: The Account id.
  responses:
    '200':
      description: Members listed
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../models/account-membership.yaml'
          examples:
            default:
              value:
                - accountId: Jaim1Cu1Q55uooxSens6yk
                  userId: b657195e-dc2f-11ea-8566-e7710d592c99
                  createdAt: '2020-06-01T21:57:25.888Z'
                  role: account-owner
                  firstName: John
                  lastName: Doe
                  email: john.doe@centrapay.com
                - accountId: Jaim1Cu1Q55uooxSens6yk
                  userId: 9f4b3bae-dc30-11ea-ab70-2743d9be3dd5
                  createdAt: '2020-06-02T10:14:33.021Z'
                  role: account-owner
                  firstName: Jane
                  lastName: Doe
                  email: jane.doe@centrapay.com
