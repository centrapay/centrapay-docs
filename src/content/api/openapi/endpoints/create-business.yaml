post:
  x-method: POST
  x-path: /api/businesses
  x-experimental: true
  operationId: createBusiness
  summary: Create Business
  description: This endpoint allows you to create a new Business. If `accountId` is not provided when creating a Business, then a new org account will be created and associated to the Business.
  tags:
    - businesses
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - nzbn
            - location
          properties:
            nzbn:
              $ref: '../models/business.yaml#/properties/nzbn'
            accountId:
              type: string
              description: The Centrapay accountId.
            test:
              type: boolean
              description: The created Centrapay org account will have the test flag.
            taxNumber:
              type: object
              description: The value-added tax configuration.
            location:
              type: object
              x-type: location
              description: The physical address of the business.
        examples:
          default:
            value:
              nzbn: '9429046246448'
              taxNumber:
                value: 123-456-789
                type: nz-gst
              location:
                street: 1 Head Office Way
                city: Wellington
                state: Wellington
                postCode: '6011'
                country: NZ
  responses:
    '200':
      description: Business created
      content:
        application/json:
          schema:
            $ref: '../models/business.yaml'
          examples:
            default:
              value:
                id: DKTs3U38hdhfEqwF1JKoT2
                accountId: Jaim1Cu1Q55uooxSens6yk
                accountName: Centrapay
                nzbn: '9429046246448'
                name: CENTRAPAY LIMITED
                tradingName: CentraPay
                companyNumber: '6340244'
                createdAt: '2020-06-12T01:17:46.499Z'
                updatedAt: '2020-06-12T01:17:46.499Z'
                createdBy: crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey
                updatedBy: crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey
                taxNumber:
                  value: 123-456-789
                  type: nz-gst
                location:
                  street: 1 Head Office Way
                  city: Wellington
                  state: Wellington
                  postCode: '6011'
                  country: NZ
                onboardingStatus: applied
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../index.yaml#/components/schemas/ApiError'
          examples:
            INVALID_ACCOUNT:
              description: Account does not exist, is not authorized, is of the wrong type, or is not in the NZ region.
              value:
                statusCode: 403
                error: Forbidden
                message: INVALID_ACCOUNT
            INVALID_NZBN:
              description: The NZBN provided does not match any NZ business.
              value:
                statusCode: 403
                error: Forbidden
                message: INVALID_NZBN
            BUSINESS_ALREADY_EXISTS:
              description: The account already has a business or there is already a business with the provided NZBN.
              value:
                statusCode: 403
                error: Forbidden
                message: BUSINESS_ALREADY_EXISTS
