  x-path: /api/accounts/{accountId}/loyalty-programs
  x-experimental: true
  operationId: listLoyaltyProgramsByAccount
  summary: List Loyalty Programs by Account Id
  description: |
    Returns a [paginated](/api/pagination/) list of [Loyalty Programs](#loyalty-program-model) for an Account.
