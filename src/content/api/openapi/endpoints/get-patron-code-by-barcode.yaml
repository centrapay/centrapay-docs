get:
  x-method: GET
  x-path: /api/patron-codes/barcode/{barcode}
  operationId: getPatronCodeByBarcode
  summary: Get Patron Code By Barcode
  description: |
    This endpoint allows you to retrieve a Patron Code by barcode.
  tags:
    - patron-codes
  parameters:
    - name: barcode
      in: path
      required: true
      schema:
        type: string
      example: '9990001234567895'
      description: The Patron Code barcode.
  responses:
    '200':
      description: Patron Code retrieved
      content:
        application/json:
          schema:
            $ref: ../models/patron-code.yaml
          examples:
            default:
              value:
                id: V17FByEP9gm1shSG6a1Zzx
                accountId: Jaim1Cu1Q55uooxSens6yk
                barcode: '9990001234567895'
                createdAt: '2021-06-08T22:55:00.000Z'
                expiresAt: '2021-06-08T23:00:00.000Z'
                appName: centrapay
                assetId: WRhAxxWpTKb5U7pXyxQjjY
                metadata:
                  deviceId: device-001
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            CHECKSUM_FAILED:
              description: Luhn checksum digit doesn't pass.
              value:
                message: CHECKSUM_FAILED
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            PATRON_CODE_INVALID:
              description: Patron Code doesn't exist or it has expired.
              value:
                message: PATRON_CODE_INVALID
