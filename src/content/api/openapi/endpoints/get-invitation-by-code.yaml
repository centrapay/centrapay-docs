  x-path: /api/invitations/code/{code}
  x-experimental: true
  operationId: getInvitationByCode
  summary: Get Invitation By Code
  description: This endpoint allows you to retrieve an Invitation by code.
  tags:
    - invitations
  parameters:
    - name: code
      in: path
      required: true
      schema:
        type: string
