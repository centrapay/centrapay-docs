get:
  x-method: GET
  x-path: /api/assets/{assetId}/transactions
  x-experimental: true
  operationId: listAssetTransactions
  summary: List Asset Transactions
  description: |
    Returns a [paginated](/api/pagination) list of [Asset Transactions](#asset-transaction-activity-model). This endpoint is currently only supported for `quartz` asset types.
  tags:
    - asset-activities
  parameters:
    - name: assetId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Asset id.
  responses:
    '200':
      description: Asset Transactions listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../models/asset-transaction-activity.yaml
              nextPageKey:
                type: string
          examples:
            default:
              value:
                items:
                  - ref: adRGJqMyMhmGfnDXasRZ
                    type: transfer
                    kind: refund
                    refType: payment-request
                    assetId: WRhAxxWpTKb5U7pXyxQjjY
