get:
  x-method: GET
  x-path: /api/merchants/{merchantId}/payment-links
  x-experimental: true
  operationId: listPaymentLinks
  summary: List Payment Links
  description: This endpoint allows you to retrieve a [paginated](/api/pagination) list of active Payment Links for a merchant.
  tags:
    - payment-links
  parameters:
    - name: merchantId
      in: path
      required: true
      schema:
        type: string
      example: 5ee0c486308f590260d9a07f
      description: The Merchant id.
    - name: pageKey
      in: query
      schema:
        type: string
      description: Used to retrieve the next page of items.
    - name: paginationLimit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
      description: Maximum number of Payment Links to return (1-20). Defaults to 10.
  responses:
    '200':
      description: Payment Links listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '../models/payment-link.yaml'
              nextPageKey:
                type: string
          examples:
            default:
              value:
                items:
                  - id: pl_WRhAxxWpTKb5U7pXyxQjjY
                    status: active
                    name: Front Checkout
                    merchantId: 5ee0c486308f590260d9a07f
