post:
  x-method: POST
  x-path: /api/asset-program-memberships/{id}/approve
  x-experimental: true
  operationId: approveAssetProgramMembership
  summary: Approve Asset Program Membership
  description: |
    This endpoint allows you to approve an Asset Program Membership. This action can only be performed by the Asset Program owner.
  tags:
    - asset-program-memberships
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      example: apm_Xv990BzkgfoDS7bBls50pd
      description: The unique identifier of the Asset Program Membership.
  responses:
    '200':
      description: Asset Program Membership approved
      content:
        application/json:
          schema:
            $ref: ../models/asset-program-membership.yaml
          examples:
            default:
              value:
                id: apm_Xv990BzkgfoDS7bBls50pd
                accountId: Jaim1Cu1Q55uooxSens6yk
                assetProgramId: ap_WRhAxxWpTKb5U7pXyxQjjY
                status: created
                test: true
                createdAt: '2021-08-25T00:02:49.488Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                updatedAt: '2021-08-25T00:05:30.456Z'
                updatedBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                tosAcceptedAt: '2021-08-25T00:03:15.123Z'
                approvedAt: '2021-08-25T00:05:30.456Z'
                billingBankAccountId: WRhAxxWpTKb5U7pXyxQjjY
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            BILLING_BANK_ACCOUNT_REQUIRED:
              description: A billing bank account is required before the membership can be accepted or approved.
              value:
                statusCode: 403
                error: Forbidden
                message: BILLING_BANK_ACCOUNT_REQUIRED
