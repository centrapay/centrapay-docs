put:
  x-method: PUT
  x-path: /api/loyalty-programs/{loyaltyProgramId}/visibility
  x-experimental: true
  operationId: setLoyaltyProgramVisibility
  summary: Set Visibility for Loyalty Program
  description: |
    Allows the user to set the visibility of the Loyalty Program.
  tags:
    - loyalty-programs
  parameters:
    - name: loyaltyProgramId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Loyalty Program id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - visibility
          properties:
            visibility:
              $ref: '../models/loyalty-program.yaml#/properties/visibility'
        examples:
          default:
            value:
              visibility: public
  responses:
    '200':
      description: Loyalty Program visibility set
      content:
        application/json:
          schema:
            $ref: ../models/loyalty-program.yaml
          examples:
            default:
              value:
                id: WRhAxxWpTKb5U7pXyxQjjY
                name: Centrapay Cafe Loyalty Program
                description: 'Centrapay Cafe Loyalty: Earn rewards, enjoy perks! Join now!'
                mediaUploadId: 8aoMfscvtuewsuJzmzBzAs
                img: https://media-upload.centrapay.com/image.png?jhbdsfau67ewejshb=487hsdjhbdgs743
                accountId: Jaim1Cu1Q55uooxSens6yk
                createdAt: '2021-08-25T00:02:49.488Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                test: true
                status: active
                memberCount: '2'
                visibility: public
