get:
  x-method: GET
  x-path: /api/wallets/{walletId}/transactions
  operationId: listWalletAssetTransactions
  summary: List Wallet Asset Transactions
  description: This endpoint allows you to list Wallet Asset Transactions.
  tags:
    - wallet-assets
  parameters:
    - name: walletId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Wallet Asset id.
  responses:
    '200':
      description: Wallet Asset Transactions listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '../models/wallet-asset-transaction.yaml'
          examples:
            default:
              value:
                items:
                  - activityNumber: '1'
                    amount: '5000'
                    value: '5000'
                    createdAt: '2020-06-17T18:00:23.000Z'
                    srcParty: 12-4000-100001-00
                    destWalletId: EBVSreNmpsE2Pazw3SipXC
                    topupId: 77hqHDzw6KaaG2P2hoshUB
