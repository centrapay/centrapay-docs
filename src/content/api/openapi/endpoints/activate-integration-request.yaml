post:
  x-method: POST
  x-path: /api/integration-requests/{integrationRequestId}/activate
  x-experimental: true
  operationId: activateIntegrationRequest
  summary: Activate Integration Request
  description: This endpoint allows you to activate an Integration Request.
  tags:
    - integration-requests
  parameters:
    - name: integrationRequestId
      in: path
      required: true
      schema:
        type: string
      example: DKTs3U38hdhfEqwF1JKoT2
      description: The Integration Request id.
  responses:
    '200':
      description: Integration Request activated
      content:
        application/json:
          schema:
            $ref: '../models/integration-request.yaml'
          examples:
            default:
              value:
                id: DKTs3U38hdhfEqwF1JKoT2
                accountId: Jaim1Cu1Q55uooxSens6yk
                merchantId: 5ee0c486308f590260d9a07f
                type: epay
                status: active
                terminalId: '11000021'
                createdAt: '2020-06-12T01:17:46.499Z'
                updatedAt: '2020-06-12T01:17:46.499Z'
                createdBy: 'crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey'
                updatedBy: 'crn:WIj211vFs9cNACwBb04vQw:api-key:MyApiKey'
                product:
                  name: koha-card
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../index.yaml#/components/schemas/ApiError'
          examples:
            INTEGRATION_PARAM_MISSING:
              description: Integration Request needs updating with the parameters before activating.
              value:
                message: INTEGRATION_PARAM_MISSING
            INTEGRATION_ALREADY_ACTIVATED:
              description: Integration Request is already activated.
              value:
                message: INTEGRATION_ALREADY_ACTIVATED
