  x-path: /api/accounts/{id}/asset-program-memberships
  x-experimental: true
  operationId: listAssetProgramMembershipsByAccount
  summary: List Asset Program Memberships by Account
  description: |
    This endpoint allows you to list [Asset Program Memberships](#asset-program-membership-model) for a specific Account.
  tags:
    - asset-program-memberships
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      example: Jaim1Cu1Q55uooxSens6yk
      description: The unique identifier of the Account.
    - name: status
      in: query
      schema:
        type: string
      description: 'Filter memberships by status. Possible values: `created`, `active`, `inactive`.'
    - name: pageKey
      in: query
      schema:
        type: string
      description: The page key used in pagination to fetch the next page of results.
    - name: paginationLimit
      in: query
      schema:
        type: number
      description: The maximum number of results per page. Maximum value is 100. Defaults to 50.
