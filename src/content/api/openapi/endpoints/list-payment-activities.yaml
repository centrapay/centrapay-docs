get:
  x-method: GET
  x-path: /api/payment-activities
  operationId: listPaymentActivities
  summary: List Payment Activities for a Merchant
  description: |
    This endpoint allows you to list [Payment Activities](#payment-activity-model) for a Merchant.
    Results are [paginated](/api/pagination/) and ordered by descending activity created date.
  tags:
    - payment-requests
  parameters:
    - name: merchantId
      in: query
      required: true
      schema:
        type: string
      example: 5ee0c486308f590260d9a07f
      description: The id of the [Merchant](/api/merchants/) the Payment Request is on behalf of.
    - name: pageKey
      in: query
      required: true
      schema:
        type: string
      example: 'PaymentRequest#E9eXsErwA444qFDoZt5iLA|Activity#000000000000001|614161c4c4d3020073bd4ce8|2021-09-15T03:00:21.156Z'
      description: Used to retrieve the next page of items. Note that the `pageKey` value, if provided, needs to be URL-encoded.
  responses:
    '200':
      description: Payment Activities listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '../models/payment-activity.yaml'
              nextPageKey:
                type: string
          examples:
            default:
              value:
                nextPageKey: 'PaymentRequest#E9eXsErwA444qFDoZt5iLA|Activity#000000000000001|614161c4c4d3020073bd4ce8|2021-09-15T03:00:21.156Z'
                items:
                  - type: refund
                    value:
                      currency: NZD
                      amount: '600'
                    assetType: centrapay.nzd.main
                    paymentRequestId: MhocUmpxxmgdHjr7DgKoKw
                    shortCode: CP-C7F-ZS5-032
                    merchantName: Centrapay Café
                    merchantId: 5ee0c486308f590260d9a07f
                    merchantAccountId: C4QnjXvj8At6SMsEN4LRi9
                    merchantConfigId: 5ee168e8597be5002af7b454
                    createdAt: '2021-06-12T01:17:00.000Z'
                    createdBy: 'crn::user:0af834c8-1110-11ec-9072-3e22fb52e878'
                    paymentRequestCreatedBy: 'crn::user:0af834c8-1110-11ec-9072-3e22fb52e878'
                    activityNumber: '3'
                  - type: payment
                    value:
                      currency: NZD
