post:
  x-method: POST
  x-path: /api/bank-accounts/{bankAccountId}/verify
  operationId: verifyBankAccount
  summary: Verify Bank Account
  description: |
    Verification codes show up on statements when a user makes withdrawals and deposits. To verify an account, you need to direct the user to make a Top Up or Withdrawal and then check their statement.
  tags:
    - bank-accounts
  parameters:
    - name: bankAccountId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Bank Account id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - verificationCode
          properties:
            verificationCode:
              type: string
              description: The code on the user’s bank statement.
        examples:
          default:
            value:
              verificationCode: '1111'
  responses:
    '200':
      description: Bank Account verified
      content:
        application/json:
          schema:
            type: object
            properties:
              verificationCode:
                type: string
          examples:
            default:
              value:
                verificationCode: '1111'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            BANK_ACCOUNT_ALREADY_VERIFIED:
              description: The bank account is already verified.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_ACCOUNT_ALREADY_VERIFIED
            VERIFICATION_CODE_INVALID:
              description: The verification code is incorrect.
              value:
                statusCode: 403
                error: Forbidden
                message: VERIFICATION_CODE_INVALID
            BANK_ACCOUNT_VERIFICATION_ATTEMPTS_EXCEEDED:
              description: The bank account's maximum failed verification attempts has been reached.
              value:
                statusCode: 403
                error: Forbidden
                message: BANK_ACCOUNT_VERIFICATION_ATTEMPTS_EXCEEDED
            ACCOUNT_MISMATCH:
              description: The top up / withdrawal and the bank account do not belong to the same account.
              value:
                statusCode: 403
                error: Forbidden
                message: ACCOUNT_MISMATCH
