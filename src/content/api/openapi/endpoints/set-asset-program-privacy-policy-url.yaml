post:
  x-method: POST
  x-path: /api/asset-programs/{id}/set-privacy-policy-url
  x-experimental: true
  operationId: setAssetProgramPrivacyPolicyUrl
  summary: Set Asset Program Privacy Policy URL
  description: |
    This endpoint allows you to set the privacy policy url for an Asset Program.
  tags:
    - asset-programs
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      example: ap_WRhAxxWpTKb5U7pXyxQjjY
      description: The Asset Program id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - privacyPolicyUrl
          properties:
            privacyPolicyUrl:
              type: string
              description: The URL to the privacy policy for the Asset Program.
        examples:
          default:
            value:
              privacyPolicyUrl: https://example.com/privacy-new
  responses:
    '200':
      description: Privacy policy URL set
      content:
        application/json:
          schema:
            $ref: ../models/asset-program.yaml
          examples:
            default:
              value:
                id: ap_WRhAxxWpTKb5U7pXyxQjjY
                accountId: Jaim1Cu1Q55uooxSens6yk
                assetTypes:
                  - payap-debit
                createdAt: '2021-08-25T00:02:49.488Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                mediaUploadId: 8aoMfscvtuewsuJzmzBzAs
                name: My Asset Program
                privacyPolicyUrl: https://example.com/privacy-new
                published: true
                termsOfServiceUrl: https://example.com/terms
                test: true
                updatedAt: '2021-08-25T00:02:49.488Z'
                updatedBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                collectionIds:
                  - c_Xv990BzkgfoDS7bBls50pd
