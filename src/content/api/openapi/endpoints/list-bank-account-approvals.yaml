get:
  x-method: GET
  x-path: /api/bank-accounts/{bankAccountId}/approvals
  x-experimental: true
  operationId: listBankAccountApprovals
  summary: List Bank Account Approvals
  description: |
    This endpoint allows you to list the Bank Account Approvals for a Bank Account.
  tags:
    - bank-account-approvals
  parameters:
    - name: bankAccountId
      in: path
      required: true
      schema:
        type: string
      example: 5vpkxjn6z787LiAKCqwuf9
      description: The [Bank Account](/api/bank-accounts) id.
    - name: pageKey
      in: query
      schema:
        type: string
      description: Used to retrieve the next page of items.
    - name: paginationLimit
      in: query
      schema:
        type: integer
      description: The maximum number of results per page. Maximum value is 200.
  responses:
    '200':
      description: Bank Account Approvals listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../models/bank-account-approval.yaml
              nextPageKey:
                type: string
