post:
  x-method: POST
  x-path: /api/collections/{collectionId}/redemption-conditions/{redemptionConditionId}/set-allowed-products
  x-experimental: true
  operationId: setRedemptionConditionAllowedProducts
  summary: Set Allowed Products for Redemption Condition
  description: |
    This endpoint allows you to set [Allowed Products](#allowed-products-model) for a [Redemption Condition](#redemption-condition-model).
  tags:
    - tokens
  parameters:
    - name: collectionId
      in: path
      required: true
      schema:
        type: string
      example: c_NFhUgPQEYbk2EbTXAYArTX
      description: The Token Collection id.
    - name: redemptionConditionId
      in: path
      required: true
      schema:
        type: string
      example: DKTs3U38hdhfEqwF1JKoT2
      description: The Redemption Condition id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - allowedProducts
          properties:
            allowedProducts:
              type: array
              items:
                $ref: ../models/allowed-products.yaml
              description: List of [Allowed Products](#allowed-products-model). Required for collections of type `product`.
        examples:
          default:
            value:
              allowedProducts:
                - sku: '100001'
                  name: White Bread
                  maxValue:
                    currency: NZD
                    amount: '400'
                - sku: '100002'
                  name: Sourdough Bread
                  maxValue:
                    currency: NZD
                    amount: '800'
  responses:
    '200':
      description: Allowed Products set
      content:
        application/json:
          schema:
            $ref: ../models/redemption-condition.yaml
          examples:
            default:
              value:
                id: DKTs3U38hdhfEqwF1JKoT2
                merchantId: 36EALpZ89XpShxM2Ee9sXT
                collectionId: c_NFhUgPQEYbk2EbTXAYArTX
                allowedProducts:
                  - sku: '100001'
                    name: White Bread
                    maxValue:
                      currency: NZD
                      amount: '400'
                  - sku: '100002'
                    name: Sourdough Bread
                    maxValue:
                      currency: NZD
                      amount: '800'
                createdAt: '2022-05-12T04:30:11.001Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                updatedAt: '2022-11-12T04:30:11.001Z'
                updatedBy: crn::user:b657195e-dc2f-11ea-8566-e7710a542c49
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            INVALID_AMOUNT:
              description: One or more of the maxValue amount in the products has exceeded the maxValue amount defined on the collection.
              value:
                message: INVALID_AMOUNT
