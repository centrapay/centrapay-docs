post:
  x-method: POST
  x-path: /api/loyalty-programs/{loyaltyProgramId}/memberships
  x-experimental: true
  operationId: createLoyaltyProgramMembership
  summary: Create Loyalty Program Memberships
  description: |
    This endpoint allows you to create [Loyalty Program Memberships](#loyalty-program-membership-model) to onboard users to [Loyalty Programs](#loyalty-program-model).

    If the Account is already a member of the Loyalty Program, the existing membership is returned (and reactivated if it was archived).
  tags:
    - loyalty-program-memberships
  parameters:
    - name: loyaltyProgramId
      in: path
      required: true
      schema:
        type: string
      example: WRhAxxWpTKb5U7pXyxQjjY
      description: The Loyalty Program id.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - accountId
          properties:
            accountId:
              type: string
              description: The [Account](/api/accounts/) that is being onboarded to the Loyalty Program.
        examples:
          default:
            value:
              accountId: Jaim1Cu1Q55uooxSens6yk
  responses:
    '200':
      description: Loyalty Program Membership created
      content:
        application/json:
          schema:
            $ref: ../models/loyalty-program-membership.yaml
          examples:
            default:
              value:
                id: L75M3L56N2PtBSt8g7uXLU
                accountId: Jaim1Cu1Q55uooxSens6yk
                programId: WRhAxxWpTKb5U7pXyxQjjY
                name: Centrapay Cafe Loyalty Program
                description: 'Centrapay Cafe Loyalty: Earn rewards, enjoy perks! Join now!'
                status: active
                mediaUploadId: 8aoMfscvtuewsuJzmzBzAs
                img: https://media-upload.centrapay.com/image.png?jhbdsfau67ewejshb=487hsdjhbdgs743
                createdAt: '2021-08-25T00:02:49.488Z'
                createdBy: crn::user:b657195e-dc2f-11ea-8566-e7710d592c99
                test: true
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../index.yaml#/components/schemas/ApiError
          examples:
            LOYALTY_PROGRAM_ACCOUNT_LIVENESS_MISMATCH:
              description: The account cannot be test if the loyalty program is not test.
              value:
                message: LOYALTY_PROGRAM_ACCOUNT_LIVENESS_MISMATCH
            LOYALTY_PROGRAM_INACTIVE:
              description: Memberships can only be created for loyalty programs with an `active` status.
              value:
                message: LOYALTY_PROGRAM_INACTIVE
            JOIN_CONDITIONS_NOT_MET:
              description: The account does not meet the join conditions for the loyalty program.
              value:
                message: JOIN_CONDITIONS_NOT_MET
