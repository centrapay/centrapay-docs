get:
  x-method: GET
  x-path: /api/accounts/{accountId}/managed-integrations
  operationId: listAccountManagedIntegrations
  summary: List Managed Integration
  description: |
    This endpoint allows you to retrieve the list of managed integrations for an account.
    Returns a [paginated](/api/pagination/) list of Managed Integrations for an Account.
  tags:
    - managed-integrations
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
      example: Jaim1Cu1Q55uooxSens6yk
      description: The Account id.
    - name: pageKey
      in: query
      schema:
        type: string
      example: 'IntegrationRequest#k9oBPAOgjz4k6a9MXNfRlF|#IntegrationRequest|Jaim1Cu1Q55uooxSens6yk'
      description: Used to retrieve the next page of items.
  responses:
    '200':
      description: Managed Integrations listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '../models/managed-integration.yaml'
              nextPageKey:
                type: string
