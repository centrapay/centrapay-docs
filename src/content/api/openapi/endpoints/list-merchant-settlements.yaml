get:
  x-method: GET
  x-path: /api/merchants/{merchantId}/settlements
  operationId: listMerchantSettlements
  summary: List Settlements
  description: |
    This endpoint allows you to list Settlements.
  tags:
    - settlements
  parameters:
    - name: merchantId
      in: path
      required: true
      schema:
        type: string
      example: 5ee0c486308f590260d9a07f
      description: The [Merchant](/api/merchants/) id.
  responses:
    '200':
      description: Settlements listed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../models/settlement.yaml
          examples:
            default:
              value:
                items:
