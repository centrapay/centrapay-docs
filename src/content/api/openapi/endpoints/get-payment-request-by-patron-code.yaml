get:
  x-method: GET
  x-path: /api/me/patron-code-payment-request
  x-auth-header: Authorization
  operationId: getPaymentRequestByPatronCode
  summary: Get a Payment Request linked to a Patron Code
  description: >-
    Returns the latest Payment Request with status `new` that has been attached to a
    [Patron Code](/api/patron-codes). The Payment Request may have been created with a
    reference to any Patron Code owned by the user's account.


    This endpoint should be polled just after a user's Patron Code has been scanned. This
    will allow them to find the Payment Request and proceed to pay.
  tags:
    - payment-requests
  responses:
    '200':
      description: Payment Request retrieved
      content:
        application/json:
          schema:
            $ref: '../models/payment-request.yaml'
          examples:
            default:
              value:
                id: MhocUmpxxmgdHjr7DgKoKw
                shortCode: CP-C7F-ZS5
                url: https://app.centrapay.com/pay/MhocUmpxxmgdHjr7DgKoKw
                patronCodeId: V17FByEP9gm1shSG6a1Zzx
                barcode: '9990001234567895'
                merchantId: 26d3Cp3rJmbMHnuNJmks2N
                merchantName: Centrapay Café
                configId: 5efbe2fb96c08357bb2b9242
                value:
                  currency: NZD
                  amount: '100'
                paymentOptions:
                  - amount: '100'
                    assetType: centrapay.nzd.test
                merchantConditions: []
                status: new
                createdAt: '2021-06-08T04:04:27.426Z'
                updatedAt: '2021-06-08T04:04:27.426Z'
                expiresAt: '2021-06-08T04:06:27.426Z'
                liveness: test
                expirySeconds: 120
                connectionId: cn_9asd9k19
                connectionStatus: active
